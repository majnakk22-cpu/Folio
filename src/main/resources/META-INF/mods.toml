modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Folio"
authors="${mod_authors}"
description='''
Folio — библиотека книжного интерфейса для модов: книги-руководства с гиперссылками, журналы с записями,
записки, общая разметка текста и набор кнопок. Сама по себе ничего не добавляет в игру.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"
